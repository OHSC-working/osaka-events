<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>大阪イベントカレンダー｜Osaka Event Calendar</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Helvetica Neue",Arial,sans-serif;background:#F7F5EF;color:#2E2C28;min-height:100vh}
header{background:#F7F5EF;border-bottom:1px solid #E3DED2;padding:1.5rem 1.5rem 1.25rem}
.header-inner{max-width:900px;margin:0 auto}
h1{font-size:21px;font-weight:600;letter-spacing:-.3px;color:#2E2C28}
.subtitle{font-size:12px;color:#9A9488;margin-top:3px}
/* 定期開催セクション */
.regular-section{max-width:900px;margin:1rem auto 0;padding:0 1.5rem}
.regular-box{background:#EFEBE1;border:1px solid #E3DED2;border-radius:14px;padding:14px 18px}
.regular-title{font-size:13px;font-weight:600;color:#45433D;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.regular-item{font-size:13px;color:#57534A;line-height:1.8;display:flex;gap:8px;align-items:baseline}
.regular-item .ri-emoji{font-size:15px}
.controls{max-width:900px;margin:1.25rem auto;padding:0 1.5rem;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.date-wrap{display:flex;align-items:center;gap:6px;font-size:13px;color:#8C887E}
input[type=date]{font-size:13px;padding:6px 10px;border:1px solid #E3DED2;border-radius:8px;background:#fff;color:#2E2C28}
.filters{display:flex;flex-wrap:wrap;gap:6px;margin-left:auto}
.filter-sep{width:1px;background:#D8D3C8;margin:0 4px}
.btn{font-size:12px;padding:5px 14px;border:1px solid #E3DED2;border-radius:20px;background:#fff;color:#8C887E;cursor:pointer;transition:all .15s}
.btn.active{background:#2E2C28;color:#fff;border-color:#2E2C28}
.cards{max-width:900px;margin:0 auto;padding:0 1.5rem 3rem;display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.card{background:#fff;border:1px solid #E9E4D8;border-radius:14px;overflow:hidden;cursor:pointer;transition:box-shadow .15s,transform .15s}
.card:hover{box-shadow:0 4px 20px rgba(46,44,40,.10);transform:translateY(-2px)}
.card-img{width:100%;height:auto;max-height:220px;object-fit:contain;background:#F0ECE2;display:block}
.card-img-emoji{width:100%;height:160px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;background:#E9E4D8;color:#45433D;padding:0 18px;text-align:center}
.ph-icon{font-size:34px;line-height:1}
.ph-title{font-size:14px;font-weight:600;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card-img-emoji.sports{background:#DCE2DF}
.badge-sports{background:#2E2C28;color:#fff}
.card-body{padding:14px}
.card-meta{display:flex;align-items:center;gap:8px;margin-bottom:7px;flex-wrap:wrap}
.badge{font-size:11px;padding:2px 9px;border-radius:10px;font-weight:500;background:#EFEBE1;color:#57534A}
.badge-unconfirmed{background:#DDD7C9;color:#3A3833;font-weight:600}
.card-date{font-size:11px;color:#9A9488}
.card-area{font-size:11px;color:#9A9488;margin-bottom:5px}
.card-title{font-size:15px;font-weight:600;margin-bottom:5px;line-height:1.4;color:#2E2C28}
.card-desc{font-size:12px;color:#6B655A;line-height:1.6;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.detail-wrap{max-width:900px;margin:1.5rem auto;padding:0 1.5rem}
.detail-box{background:#fff;border:1px solid #E9E4D8;border-radius:16px;padding:2rem}
.detail-img{width:100%;height:auto;max-height:420px;object-fit:contain;background:#F0ECE2;border-radius:10px;margin-bottom:1rem;display:block}
.detail-emoji{font-size:48px;margin-bottom:.5rem}
.detail-title{font-size:22px;font-weight:700;margin-bottom:4px;color:#2E2C28}
.detail-section{margin-bottom:1.25rem}
.detail-label{font-size:11px;color:#9A9488;text-transform:uppercase;letter-spacing:.5px;margin-bottom:5px;font-weight:600}
.detail-value{font-size:14px;color:#2E2C28;line-height:1.7}
.detail-link{color:#45433D;font-size:14px;text-decoration:none;display:block;margin-top:4px;font-weight:600}
.detail-link:hover{text-decoration:underline}
.manner-box{background:#F0ECE2;border:1px solid #E3DED2;border-radius:10px;padding:12px 14px;font-size:13px;color:#57534A;line-height:1.7}
.yt-wrap{position:relative;padding-bottom:56.25%;height:0;border-radius:10px;overflow:hidden;margin-top:8px}
.yt-wrap iframe{position:absolute;top:0;left:0;width:100%;height:100%;border:0}
.back-btn{font-size:13px;padding:8px 16px;border:1px solid #E3DED2;border-radius:8px;background:#fff;color:#8C887E;cursor:pointer;margin-top:1.5rem}
.back-btn:hover{background:#F0ECE2}
.empty{text-align:center;padding:4rem;color:#45433D;font-size:14px}
.loading{text-align:center;padding:4rem;color:#45433D;font-size:14px}
.error-box{max-width:900px;margin:2rem auto;padding:0 1.5rem}
.error-msg{background:#F7F0EC;border:1px solid #E2CFC2;border-radius:10px;padding:1rem 1.25rem;font-size:13px;color:#8C4A3A}
@media(max-width:600px){
.controls{flex-direction:column;align-items:flex-start}
.filters{margin-left:0}
}
</style>
</head>
<body>
<header>
<div class="header-inner">
<h1>大阪イベントカレンダー</h1>
<div class="subtitle">民泊ゲスト向け — Osaka Event Guide for Guests</div>
</div>
</header>
<div class="regular-section" id="regular-section" style="display:none">
<div class="regular-box">
<div class="regular-title">📌 定期開催イベント（いつでも楽しめます）</div>
<div id="regular-list"></div>
</div>
</div>
<div class="controls">
<div class="date-wrap">
<span>チェックイン</span>
<input type="date" id="date-from">
<span>〜</span>
<input type="date" id="date-to">
</div>
<div class="filters">
<button class="btn active" data-area="all">すべて</button>
<button class="btn" data-area="大阪市内">大阪市内</button>
<button class="btn" data-area="大阪市外">大阪市外</button>
<span class="filter-sep"></span>
<button class="btn active" data-cat="all">全ジャンル</button>
<button class="btn" data-cat="event">🏮 イベント</button>
<button class="btn" data-cat="sports">⚽ スポーツ</button>
</div>
</div>
<div id="app"></div>
<script>
const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRKTG6J-epN19t79VjesPdo5iskeBC1C7coYDjY1dAMIt5C-asJjwYeY87WtFGExhviGprXVzmzXc0B/pub?gid=0&single=true&output=csv";
let allEvents = [];
let area = "all";
let dateFrom = null;
let dateTo = null;
let cat = "all";
// エリア：「どちらも」は両方に表示。「大阪市内」以外（北大阪・泉州・兵庫など旧区分も）は「大阪市外」として扱う
const areaGroup = a => a === "大阪市内" ? "大阪市内" : "大阪市外";
const areaMatch = ev => area === "all" || ev.area === "どちらも" || areaGroup(ev.area) === area;
const catMatch = ev => cat === "all" || (cat === "sports") === isSports(ev);
const isSports = ev => ev.category === "スポーツ";
function esc(t) { return String(t || "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;"); }
function placeholderHTML(title, sports) {
return `<div class="card-img-emoji${sports ? " sports" : ""}"><span class="ph-icon">${sports ? "⚽" : "🏮"}</span><span class="ph-title">${esc(title)}</span></div>`;
}
// 画像の優先順位：①画像URL → ②YouTubeサムネイル → ③タイトル入りプレースホルダー
function thumbHTML(ev, cls) {
const yt = getYouTubeId(ev.youtube);
const ytUrl = yt ? `https://img.youtube.com/vi/${yt}/hqdefault.jpg` : "";
const src = ev.image_url || ytUrl;
if (!src) return placeholderHTML(ev.title, isSports(ev));
const next = (ev.image_url && ytUrl) ? ytUrl : "";
return `<img class="${cls}" src="${esc(src)}" alt="${esc(ev.title)}" loading="lazy" data-next="${esc(next)}" data-title="${esc(ev.title)}" data-sports="${isSports(ev) ? 1 : ""}" onerror="imgFail(this)">`;
}
function imgFail(img) {
if (img.dataset.next) { const n = img.dataset.next; img.dataset.next = ""; img.src = n; return; }
img.outerHTML = placeholderHTML(img.dataset.title, !!img.dataset.sports);
}
function getYouTubeId(url) {
if (!url) return null;
const patterns = [
/youtube\.com\/watch\?v=([^&]+)/,
/youtu\.be\/([^?]+)/,
/youtube\.com\/embed\/([^?]+)/
];
for (const p of patterns) {
const m = url.match(p);
if (m) return m[1];
}
return null;
}
// CSVを行×列に分解（"…" 内のカンマ・改行・"" エスケープに対応）
function splitCSV(text) {
const rows = [];
let row = [], cur = "", inQ = false;
for (let i = 0; i < text.length; i++) {
const c = text[i];
if (inQ) {
if (c === '"' && text[i + 1] === '"') { cur += '"'; i++; }
else if (c === '"') inQ = false;
else cur += c;
} else if (c === '"') inQ = true;
else if (c === ",") { row.push(cur); cur = ""; }
else if (c === "\n") { row.push(cur); rows.push(row); row = []; cur = ""; }
else if (c !== "\r") cur += c;
}
row.push(cur); rows.push(row);
return rows;
}
// 列は見出し名で探す（シートの列を追加・移動しても壊れない）。見つからなければ従来の列番号
const COLS = {
status: ["Status", 1], title: ["タイトル", 2], date_start: ["開始日", 3], date_end: ["終了日", 4],
date_confirmed: ["日程ステータス", 5], regular_note: ["定期開催かどうか", 6], area: ["エリア", 7],
place: ["場所・地名", 8], map_url: ["GoogleMap", 9], desc: ["概要", 10], manner: ["注意事項", 11],
url: ["公式URL", 12], reserve: ["予約方法", 13], youtube: ["紹介youtube_English(URL)", 14],
image_url: ["画像URL", 15], category: ["カテゴリ", 17]
};
function parseCSV(text) {
const rows = splitCSV(text.trim());
const header = rows[0].map(h => h.trim());
const idx = {};
for (const [key, [name, fallback]] of Object.entries(COLS)) {
const i = header.indexOf(name);
idx[key] = i >= 0 ? i : fallback;
}
const events = [];
for (let r = 1; r < rows.length; r++) {
const cols = rows[r];
const get = key => (cols[idx[key]] || "").trim();
if (get("status") !== "公開") continue;
const ev = {};
for (const key of Object.keys(COLS)) if (key !== "status") ev[key] = get(key);
ev.is_regular = ev.regular_note ? "YES" : "NO";
events.push(ev);
}
return events;
}
async function loadEvents() {
const app = document.getElementById("app");
app.innerHTML = '<div class="loading">イベント情報を読み込み中...</div>';
try {
const res = await fetch(CSV_URL);
if (!res.ok) throw new Error("fetch failed");
const text = await res.text();
allEvents = parseCSV(text);
if (allEvents.length === 0) {
app.innerHTML = '<div class="empty">スプレッドシートに「公開」のデータがありません</div>';
return;
}
renderRegular();
renderCards();
} catch(e) {
app.innerHTML = `<div class="error-box"><div class="error-msg">⚠️ データの読み込みに失敗しました。<br><small>エラー: ${e.message}</small></div></div>`;
}
}
function renderRegular() {
const regulars = allEvents.filter(ev => ev.is_regular === "YES");
const section = document.getElementById("regular-section");
const list = document.getElementById("regular-list");
if (!regulars.length) { section.style.display = "none"; return; }
section.style.display = "block";
list.innerHTML = regulars.map(ev => `
<div class="regular-item" data-title="${ev.title}">
<span class="ri-emoji">📍</span>
<span><strong>${ev.title}</strong>（${ev.area}）— ${ev.regular_note || "詳細は備考欄を確認"}</span>
</div>`).join("");
list.querySelectorAll(".regular-item").forEach(item => {
item.style.cursor = "pointer";
item.addEventListener("click", () => {
const ev = regulars.find(e => e.title === item.dataset.title);
showDetail(ev);
});
});
}
function isUpcoming(ev, today) {
if (!ev.date_end) return true;
const e = new Date(ev.date_end);
if (isNaN(e)) return true;
return e >= today;
}
function inRange(ev) {
if (!dateFrom && !dateTo) return true;
if (!ev.date_start || !ev.date_end) return true;
const s = new Date(ev.date_start), e = new Date(ev.date_end);
if (isNaN(s) || isNaN(e)) return true;
if (dateFrom && dateTo) { const f = new Date(dateFrom), t = new Date(dateTo); return s <= t && e >= f; }
if (dateFrom) return e >= new Date(dateFrom);
if (dateTo) return s <= new Date(dateTo);
return true;
}
function fmtDate(d) {
if (!d) return "";
const dt = new Date(d);
if (isNaN(dt)) return d;
return dt.toLocaleDateString("ja-JP", {month:"short", day:"numeric"});
}
function renderCards() {
const app = document.getElementById("app");
const today = new Date(); today.setHours(0,0,0,0);
const filtered = allEvents.filter(ev =>
ev.is_regular !== "YES" &&
areaMatch(ev) &&
catMatch(ev) &&
inRange(ev) &&
isUpcoming(ev, today)
).sort((a, b) => {
const da = new Date(a.date_start), db = new Date(b.date_start);
if (isNaN(da) && isNaN(db)) return 0;
if (isNaN(da)) return 1;
if (isNaN(db)) return -1;
return da - db;
});
if (!filtered.length) {
app.innerHTML = '<div class="empty">該当するイベントがありません</div>';
return;
}
app.innerHTML = `<div class="cards">${filtered.map((ev, i) => `
<div class="card" data-idx="${i}">
${thumbHTML(ev, "card-img")}
<div class="card-body">
<div class="card-meta">
${isSports(ev) ? `<span class="badge badge-sports">スポーツ</span>` : ""}
${ev.date_confirmed && ev.date_confirmed !== "確定" ? `<span class="badge badge-unconfirmed">日程未確定</span>` : ""}
<span class="card-date">${fmtDate(ev.date_start)}${ev.date_start !== ev.date_end ? " – " + fmtDate(ev.date_end) : ""}</span>
</div>
<div class="card-area">📍 ${ev.area}</div>
<div class="card-title">${ev.title}</div>
<div class="card-desc">${ev.desc}</div>
</div>
</div>`).join("")}</div>`;
document.querySelectorAll(".card").forEach(card => {
card.addEventListener("click", () => showDetail(filtered[parseInt(card.dataset.idx)]));
});
}
function showDetail(ev) {
const ytId = getYouTubeId(ev.youtube);
document.getElementById("app").innerHTML = `
<div class="detail-wrap">
<div class="detail-box">
${ev.image_url
? `<img class="detail-img" src="${ev.image_url}" alt="${ev.title}">`
: `<div class="detail-emoji">📅</div>`}
<div class="detail-title">${ev.title}</div>
<div class="detail-section">
<div class="detail-label">開催日程</div>
<div class="detail-value">
${ev.is_regular === "YES"
? (ev.regular_note || "定期開催")
: `${fmtDate(ev.date_start)} – ${fmtDate(ev.date_end)}${ev.date_confirmed && ev.date_confirmed !== "確定" ? "（日程未確定）" : ""}`}
</div>
</div>
<div class="detail-section">
<div class="detail-label">場所</div>
<div class="detail-value">${ev.place}</div>
${ev.map_url ? `<a class="detail-link" href="${ev.map_url}" target="_blank" rel="noopener">📍 Googleマップで見る</a>` : ""}
</div>
<div class="detail-section">
<div class="detail-label">概要</div>
<div class="detail-value">${ev.desc}</div>
</div>
${ytId ? `
<div class="detail-section">
<div class="detail-label">動画で見る</div>
<div class="yt-wrap"><iframe src="https://www.youtube.com/embed/${ytId}" allowfullscreen></iframe></div>
</div>` : ""}
<div class="detail-section">
<div class="detail-label">予約・参加方法</div>
<div class="detail-value">${ev.reserve}</div>
${ev.url ? `<a class="detail-link" href="${ev.url}" target="_blank" rel="noopener">→ 公式サイトを見る</a>` : ""}
</div>
${ev.manner ? `
<div class="detail-section">
<div class="detail-label">知っておくべきマナー・注意事項</div>
<div class="manner-box">${ev.manner}</div>
</div>` : ""}
<button class="back-btn" onclick="renderCards()">← 一覧に戻る</button>
</div>
</div>`;
}
document.querySelectorAll(".btn[data-area]").forEach(btn => {
btn.addEventListener("click", () => {
document.querySelectorAll(".btn[data-area]").forEach(b => b.classList.remove("active"));
btn.classList.add("active");
area = btn.dataset.area;
renderCards();
});
});
document.querySelectorAll(".btn[data-cat]").forEach(btn => {
btn.addEventListener("click", () => {
document.querySelectorAll(".btn[data-cat]").forEach(b => b.classList.remove("active"));
btn.classList.add("active");
cat = btn.dataset.cat;
renderCards();
});
});
document.getElementById("date-from").addEventListener("change", e => { dateFrom = e.target.value; renderCards(); });
document.getElementById("date-to").addEventListener("change", e => { dateTo = e.target.value; renderCards(); });
loadEvents();
</script>
</body>
</html>
