<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>大阪イベントカレンダー｜Osaka Event Calendar</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Helvetica Neue",Arial,sans-serif;background:#f7f6f3;color:#1a1a1a;min-height:100vh}
header{background:#fff;border-bottom:1px solid #e5e4e0;padding:1.25rem 1.5rem}
.header-inner{max-width:900px;margin:0 auto}
h1{font-size:20px;font-weight:600;letter-spacing:-.3px}
.subtitle{font-size:12px;color:#888;margin-top:2px}

/* 定期開催セクション */
.regular-section{max-width:900px;margin:1rem auto 0;padding:0 1.5rem}
.regular-box{background:#fff7e6;border:1px solid #f3d98a;border-radius:14px;padding:14px 18px}
.regular-title{font-size:13px;font-weight:600;color:#8a6300;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.regular-item{font-size:13px;color:#6b4e00;line-height:1.8;display:flex;gap:8px;align-items:baseline}
.regular-item .ri-emoji{font-size:15px}

.controls{max-width:900px;margin:1.25rem auto;padding:0 1.5rem;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.date-wrap{display:flex;align-items:center;gap:6px;font-size:13px;color:#666}
input[type=date]{font-size:13px;padding:6px 10px;border:1px solid #ddd;border-radius:8px;background:#fff;color:#1a1a1a}
.filters{display:flex;flex-wrap:wrap;gap:6px;margin-left:auto}
.btn{font-size:12px;padding:5px 14px;border:1px solid #ddd;border-radius:20px;background:#fff;color:#555;cursor:pointer;transition:all .15s}
.btn.active{background:#1a1a1a;color:#fff;border-color:#1a1a1a}
.cards{max-width:900px;margin:0 auto;padding:0 1.5rem 3rem;display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.card{background:#fff;border:1px solid #e5e4e0;border-radius:14px;overflow:hidden;cursor:pointer;transition:box-shadow .15s,transform .15s}
.card:hover{box-shadow:0 4px 20px rgba(0,0,0,.08);transform:translateY(-2px)}
.card-img{width:100%;height:160px;object-fit:cover;background:#f7f6f3}
.card-img-emoji{width:100%;height:160px;display:flex;align-items:center;justify-content:center;font-size:42px;background:#f7f6f3}
.card-body{padding:14px}
.card-meta{display:flex;align-items:center;gap:8px;margin-bottom:7px;flex-wrap:wrap}
.badge{font-size:11px;padding:2px 9px;border-radius:10px;font-weight:500;background:#f0eefe;color:#5240b8}
.badge-unconfirmed{background:#fff0e0;color:#a85d00}
.card-date{font-size:11px;color:#999}
.card-area{font-size:11px;color:#999;margin-bottom:5px}
.card-title{font-size:15px;font-weight:600;margin-bottom:5px;line-height:1.4}
.card-desc{font-size:12px;color:#666;line-height:1.6;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.detail-wrap{max-width:900px;margin:1.5rem auto;padding:0 1.5rem}
.detail-box{background:#fff;border:1px solid #e5e4e0;border-radius:16px;padding:2rem}
.detail-img{width:100%;height:220px;object-fit:cover;border-radius:10px;margin-bottom:1rem}
.detail-emoji{font-size:48px;margin-bottom:.5rem}
.detail-title{font-size:22px;font-weight:700;margin-bottom:4px}
.detail-section{margin-bottom:1.25rem}
.detail-label{font-size:11px;color:#999;text-transform:uppercase;letter-spacing:.5px;margin-bottom:5px;font-weight:600}
.detail-value{font-size:14px;color:#333;line-height:1.7}
.detail-link{color:#2060c8;font-size:14px;text-decoration:none;display:block;margin-top:4px}
.detail-link:hover{text-decoration:underline}
.manner-box{background:#fffbeb;border:1px solid #f5d87a;border-radius:10px;padding:12px 14px;font-size:13px;color:#7a5800;line-height:1.7}
.yt-wrap{position:relative;padding-bottom:56.25%;height:0;border-radius:10px;overflow:hidden;margin-top:8px}
.yt-wrap iframe{position:absolute;top:0;left:0;width:100%;height:100%;border:0}
.back-btn{font-size:13px;padding:8px 16px;border:1px solid #ddd;border-radius:8px;background:#fff;cursor:pointer;margin-top:1.5rem}
.back-btn:hover{background:#f7f6f3}
.empty{text-align:center;padding:4rem;color:#aaa;font-size:14px}
.loading{text-align:center;padding:4rem;color:#aaa;font-size:14px}
.error-box{max-width:900px;margin:2rem auto;padding:0 1.5rem}
.error-msg{background:#fff5f5;border:1px solid #fcc;border-radius:10px;padding:1rem 1.25rem;font-size:13px;color:#c00}
@media(max-width:600px){
  .controls{flex-direction:column;align-items:flex-start}
  .filters{margin-left:0}
}
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <h1>大阪イベントカレンダー</h1>
    <div class="subtitle">民泊ゲスト向け — Osaka Event Guide for Guests</div>
  </div>
</header>

<div class="regular-section" id="regular-section" style="display:none">
  <div class="regular-box">
    <div class="regular-title">📌 定期開催イベント（いつでも楽しめます）</div>
    <div id="regular-list"></div>
  </div>
</div>

<div class="controls">
  <div class="date-wrap">
    <span>チェックイン</span>
    <input type="date" id="date-from">
    <span>〜</span>
    <input type="date" id="date-to">
  </div>
  <div class="filters">
    <button class="btn active" data-area="all">すべて</button>
    <button class="btn" data-area="大阪市内">大阪市内</button>
    <button class="btn" data-area="北大阪">北大阪</button>
    <button class="btn" data-area="東・南河内">東・南河内</button>
    <button class="btn" data-area="南大阪・泉州">南大阪・泉州</button>
  </div>
</div>

<div id="app"></div>

<script>
const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRKTG6J-epN19t79VjesPdo5iskeBC1C7coYDjY1dAMIt5C-asJjwYeY87WtFGExhviGprXVzmzXc0B/pub?gid=0&single=true&output=csv";

let allEvents = [];
let area = "all";
let dateFrom = null;
let dateTo = null;

function getYouTubeId(url) {
  if (!url) return null;
  const patterns = [
    /youtube\.com\/watch\?v=([^&]+)/,
    /youtu\.be\/([^?]+)/,
    /youtube\.com\/embed\/([^?]+)/
  ];
  for (const p of patterns) {
    const m = url.match(p);
    if (m) return m[1];
  }
  return null;
}

function parseCSV(text) {
  const lines = text.trim().split("\n");
  const events = [];
  for (let i = 1; i < lines.length; i++) {
    const cols = [];
    let cur = "", inQ = false;
    for (let c of lines[i]) {
      if (c === '"') { inQ = !inQ; }
      else if (c === "," && !inQ) { cols.push(cur.trim()); cur = ""; }
      else { cur += c; }
    }
    cols.push(cur.trim());
    const clean = (idx) => (cols[idx] || "").replace(/"/g,"").trim();

    const status = clean(10);
    if (status !== "公開") continue;

    events.push({
      title:        clean(4),
      date_start:   clean(5),
      date_end:     clean(6),
      date_confirmed: clean(7),
      is_regular:   clean(8),
      regular_note: clean(9),
      area:         clean(11),
      place:        clean(12),
      map_url:      clean(13),
      desc:         clean(14),
      manner:       clean(15),
      url:          clean(16),
      reserve:      clean(17),
      youtube:      clean(18),
      image_url:    clean(20)
    });
  }
  return events;
}

async function loadEvents() {
  const app = document.getElementById("app");
  app.innerHTML = '<div class="loading">イベント情報を読み込み中...</div>';
  try {
    const res = await fetch(CSV_URL);
    if (!res.ok) throw new Error("fetch failed");
    const text = await res.text();
    allEvents = parseCSV(text);
    if (allEvents.length === 0) {
      app.innerHTML = '<div class="empty">スプレッドシートに「公開」のデータがありません</div>';
      return;
    }
    renderRegular();
    renderCards();
  } catch(e) {
    app.innerHTML = `<div class="error-box"><div class="error-msg">⚠️ データの読み込みに失敗しました。<br><small>エラー: ${e.message}</small></div></div>`;
  }
}

function renderRegular() {
  const regulars = allEvents.filter(ev => ev.is_regular === "YES");
  const section = document.getElementById("regular-section");
  const list = document.getElementById("regular-list");
  if (!regulars.length) { section.style.display = "none"; return; }
  section.style.display = "block";
  list.innerHTML = regulars.map(ev => `
    <div class="regular-item" data-title="${ev.title}">
      <span class="ri-emoji">📍</span>
      <span><strong>${ev.title}</strong>（${ev.area}）— ${ev.regular_note || "詳細は備考欄を確認"}</span>
    </div>`).join("");
  list.querySelectorAll(".regular-item").forEach(item => {
    item.style.cursor = "pointer";
    item.addEventListener("click", () => {
      const ev = regulars.find(e => e.title === item.dataset.title);
      showDetail(ev);
    });
  });
}

function inRange(ev) {
  if (!dateFrom && !dateTo) return true;
  if (!ev.date_start || !ev.date_end) return true;
  const s = new Date(ev.date_start), e = new Date(ev.date_end);
  if (isNaN(s) || isNaN(e)) return true;
  if (dateFrom && dateTo) { const f = new Date(dateFrom), t = new Date(dateTo); return s <= t && e >= f; }
  if (dateFrom) return e >= new Date(dateFrom);
  if (dateTo)   return s <= new Date(dateTo);
  return true;
}

function fmtDate(d) {
  if (!d) return "";
  const dt = new Date(d);
  if (isNaN(dt)) return d;
  return dt.toLocaleDateString("ja-JP", {month:"short", day:"numeric"});
}

function renderCards() {
  const app = document.getElementById("app");
  // 通常イベント（定期開催は一覧カードに出さず上部のみに表示）
  const filtered = allEvents.filter(ev =>
    ev.is_regular !== "YES" &&
    (area === "all" || ev.area === area) &&
    inRange(ev)
  );
  if (!filtered.length) {
    app.innerHTML = '<div class="empty">該当するイベントがありません</div>';
    return;
  }
  app.innerHTML = `<div class="cards">${filtered.map((ev, i) => `
    <div class="card" data-idx="${i}">
      ${ev.image_url
        ? `<img class="card-img" src="${ev.image_url}" alt="${ev.title}" onerror="this.outerHTML='<div class=card-img-emoji>📅</div>'">`
        : `<div class="card-img-emoji">📅</div>`}
      <div class="card-body">
        <div class="card-meta">
          ${ev.date_confirmed && ev.date_confirmed !== "確定" ? `<span class="badge badge-unconfirmed">日程未確定</span>` : ""}
          <span class="card-date">${fmtDate(ev.date_start)}${ev.date_start !== ev.date_end ? " – " + fmtDate(ev.date_end) : ""}</span>
        </div>
        <div class="card-area">📍 ${ev.area}</div>
        <div class="card-title">${ev.title}</div>
        <div class="card-desc">${ev.desc}</div>
      </div>
    </div>`).join("")}</div>`;

  document.querySelectorAll(".card").forEach(card => {
    card.addEventListener("click", () => showDetail(filtered[parseInt(card.dataset.idx)]));
  });
}

function showDetail(ev) {
  const ytId = getYouTubeId(ev.youtube);
  document.getElementById("app").innerHTML = `
    <div class="detail-wrap">
      <div class="detail-box">
        ${ev.image_url
          ? `<img class="detail-img" src="${ev.image_url}" alt="${ev.title}">`
          : `<div class="detail-emoji">📅</div>`}
        <div class="detail-title">${ev.title}</div>
        <div class="detail-section">
          <div class="detail-label">開催日程</div>
          <div class="detail-value">
            ${ev.is_regular === "YES"
              ? (ev.regular_note || "定期開催")
              : `${fmtDate(ev.date_start)} – ${fmtDate(ev.date_end)}${ev.date_confirmed && ev.date_confirmed !== "確定" ? "（日程未確定）" : ""}`}
          </div>
        </div>
        <div class="detail-section">
          <div class="detail-label">場所</div>
          <div class="detail-value">${ev.place}</div>
          ${ev.map_url ? `<a class="detail-link" href="${ev.map_url}" target="_blank" rel="noopener">📍 Googleマップで見る</a>` : ""}
        </div>
        <div class="detail-section">
          <div class="detail-label">概要</div>
          <div class="detail-value">${ev.desc}</div>
        </div>
        ${ytId ? `
        <div class="detail-section">
          <div class="detail-label">動画で見る</div>
          <div class="yt-wrap"><iframe src="https://www.youtube.com/embed/${ytId}" allowfullscreen></iframe></div>
        </div>` : ""}
        <div class="detail-section">
          <div class="detail-label">予約・参加方法</div>
          <div class="detail-value">${ev.reserve}</div>
          ${ev.url ? `<a class="detail-link" href="${ev.url}" target="_blank" rel="noopener">→ 公式サイトを見る</a>` : ""}
        </div>
        ${ev.manner ? `
        <div class="detail-section">
          <div class="detail-label">知っておくべきマナー・注意事項</div>
          <div class="manner-box">${ev.manner}</div>
        </div>` : ""}
        <button class="back-btn" onclick="renderCards()">← 一覧に戻る</button>
      </div>
    </div>`;
}

document.querySelectorAll(".btn[data-area]").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".btn[data-area]").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    area = btn.dataset.area;
    renderCards();
  });
});

document.getElementById("date-from").addEventListener("change", e => { dateFrom = e.target.value; renderCards(); });
document.getElementById("date-to").addEventListener("change",   e => { dateTo   = e.target.value; renderCards(); });

loadEvents();
</script>
</body>
</html>
